name: Myrmidon bot image

# G1: builds docker/bot-runtime (a hermes gateway process for a bot/project
# container — item C1/H3 in docs/myrmidon/ROADMAP.md, "variant B") and
# publishes it to ghcr.io/itkadr-git/myrmidon-hermes. On a pull request this
# only checks that the image builds (no registry credentials involved, so
# this is safe to run for any PR against this repository, fork or not);
# push/push-by-digest only happens on push to main or a myr-v* release tag,
# by the pattern in myrmidon-image.yml.
#
# Two images come out of the same Dockerfile: the default `runtime` target
# (myrmidon-hermes) and the interim `runtime-node` variant with Node.js for the
# few node-script bots (myrmidon-hermes-node). Each is its own job, with the same
# gating; the default image is always built with an explicit target so a later
# stage in the Dockerfile can never silently become it.

on:
  push:
    branches: [main]
    tags: ["myr-v*"]
    paths:
      - "docker/bot-runtime/**"
      - ".github/workflows/myrmidon-bot-image.yml"
  pull_request:
    paths:
      - "docker/bot-runtime/**"
      - ".github/workflows/myrmidon-bot-image.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: myrmidon-bot-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/itkadr-git/myrmidon-hermes

jobs:
  build:
    name: build
    if: ${{ github.repository == 'itkadr-git/myrmidon' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/myr-v* ]]; then
            tag="${GITHUB_REF#refs/tags/myr-}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release tag must look like myr-vX.Y.Z, got ${GITHUB_REF#refs/tags/}"
              exit 1
            fi
            echo "image_tag=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.image_tag }},enable=${{ startsWith(github.ref, 'refs/tags/myr-v') }}
          labels: |
            org.opencontainers.image.title=Myrmidon bot runtime
            org.opencontainers.image.description=hermes gateway (API server) for a Myrmidon bot or project container
            org.opencontainers.image.source=https://github.com/itkadr-git/myrmidon
            org.opencontainers.image.licenses=MIT

      # PR: docker build only, no push — a "does it build" check. The image is
      # loaded into the runner's local daemon (never pushed) so the next step can
      # check the finished image's own metadata instead of trusting the Dockerfile.
      - name: Build (pull request, no push)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker/bot-runtime
          platforms: linux/amd64
          target: runtime
          labels: ${{ steps.meta.outputs.labels }}
          tags: myrmidon-hermes:pr-check
          push: false
          load: true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      # The G3 container driver refuses to create a container from an image that does
      # not carry this label, and the `labels:` input above is merged with the
      # Dockerfile's LABELs — check the finished image, not the source, and that the
      # runtime stage really has uv (hermes' lazy installs shell out to it).
      - name: Check the bot-runtime contract on the built image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          got="$(docker image inspect --format '{{ index .Config.Labels "myrmidon.bot-runtime.contract" }}' myrmidon-hermes:pr-check)"
          if [ "$got" != "1" ]; then
            echo "::error::built image carries myrmidon.bot-runtime.contract='$got', expected '1'"
            exit 1
          fi
          docker run --rm --entrypoint uv myrmidon-hermes:pr-check --version
          # dockergate refuses an image whose PATH has a directory under a writable
          # volume (tools/dockergate/internal/policy/image.go, unsafeRoots).
          img_path="$(docker image inspect --format '{{ range .Config.Env }}{{ println . }}{{ end }}' myrmidon-hermes:pr-check | sed -n 's/^PATH=//p')"
          echo "PATH=$img_path"
          for el in ${img_path//:/ }; do
            case "$el" in
              /data|/data/*|/workspace|/workspace/*|/scratch|/scratch/*|/tmp|/tmp/*)
                echo "::error::image PATH element $el is under a writable root"; exit 1 ;;
            esac
          done

      # push to main / myr-v* tag: build, push by digest, tag after.
      - name: Build and push by digest
        id: build
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker/bot-runtime
          platforms: linux/amd64
          target: runtime
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Tag the built digest
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"

      - name: Summary
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Myrmidon bot image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Digest | \`$IMAGE@$DIGEST\` |"
            echo "| Tags | $(jq -r '.tags | map("`" + . + "`") | join(", ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-node:
    name: build (node variant)
    env:
      IMAGE: ghcr.io/itkadr-git/myrmidon-hermes-node
    if: ${{ github.repository == 'itkadr-git/myrmidon' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/myr-v* ]]; then
            tag="${GITHUB_REF#refs/tags/myr-}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release tag must look like myr-vX.Y.Z, got ${GITHUB_REF#refs/tags/}"
              exit 1
            fi
            echo "image_tag=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.image_tag }},enable=${{ startsWith(github.ref, 'refs/tags/myr-v') }}
          labels: |
            org.opencontainers.image.title=Myrmidon bot runtime (Node.js variant)
            org.opencontainers.image.description=hermes gateway (API server) plus Node.js for a Myrmidon bot container that runs node scripts
            org.opencontainers.image.source=https://github.com/itkadr-git/myrmidon
            org.opencontainers.image.licenses=MIT

      # PR: docker build only, no push — a "does it build" check. The image is
      # loaded into the runner's local daemon (never pushed) so the next step can
      # check the finished image's own metadata instead of trusting the Dockerfile.
      - name: Build (pull request, no push)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker/bot-runtime
          platforms: linux/amd64
          target: runtime-node
          labels: ${{ steps.meta.outputs.labels }}
          tags: myrmidon-hermes-node:pr-check
          push: false
          load: true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      # The G3 container driver refuses to create a container from an image that does
      # not carry this label, and the `labels:` input above is merged with the
      # Dockerfile's LABELs — check the finished image, not the source, and that the
      # runtime stage really has uv (hermes' lazy installs shell out to it).
      - name: Check the bot-runtime contract on the built image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          got="$(docker image inspect --format '{{ index .Config.Labels "myrmidon.bot-runtime.contract" }}' myrmidon-hermes-node:pr-check)"
          if [ "$got" != "1" ]; then
            echo "::error::built image carries myrmidon.bot-runtime.contract='$got', expected '1'"
            exit 1
          fi
          docker run --rm --entrypoint uv myrmidon-hermes-node:pr-check --version
          # dockergate refuses an image whose PATH has a directory under a writable
          # volume (tools/dockergate/internal/policy/image.go, unsafeRoots).
          img_path="$(docker image inspect --format '{{ range .Config.Env }}{{ println . }}{{ end }}' myrmidon-hermes-node:pr-check | sed -n 's/^PATH=//p')"
          echo "PATH=$img_path"
          for el in ${img_path//:/ }; do
            case "$el" in
              /data|/data/*|/workspace|/workspace/*|/scratch|/scratch/*|/tmp|/tmp/*)
                echo "::error::image PATH element $el is under a writable root"; exit 1 ;;
            esac
          done

      # Node variant only: as the image's own user (uid 10001) on a read-only root,
      # the preinstalled packages must load and do real work, and node/npm must
      # write only to the volume paths (scratch), never to the root filesystem.
      - name: Check Node.js and the preinstalled packages as uid 10001 on a read-only root
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          img=myrmidon-hermes-node:pr-check
          [ "$(docker image inspect --format '{{ .Config.User }}' "$img")" = "10001:10001" ]
          [ "$(docker image inspect --format '{{ index .Config.Labels "io.github.itkadr-git.myrmidon.variant" }}' "$img")" = "node" ]
          run() { docker run --rm --read-only --user 10001:10001 --tmpfs /data:uid=10001,gid=10001 --tmpfs /workspace:uid=10001,gid=10001 --tmpfs /scratch:uid=10001,gid=10001 --tmpfs /tmp --entrypoint "$1" "$img" "${@:2}"; }
          [ "$(run id -u)" = "10001" ]
          run node -e "for (const m of ['pptxgenjs','@napi-rs/canvas','sharp','image-size','pdf-lib']) require(m); console.log('require ok')"
          run node /opt/node-tools/smoke.cjs
          run sh -c 'cd /workspace && npm init -y >/dev/null && npm cache verify >/dev/null && test -d /scratch/npm-cache && test ! -e "$HOME/.npm"'

      # push to main / myr-v* tag: build, push by digest, tag after.
      - name: Build and push by digest
        id: build
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker/bot-runtime
          platforms: linux/amd64
          target: runtime-node
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Tag the built digest
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"

      - name: Summary
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Myrmidon bot image (Node.js variant)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Digest | \`$IMAGE@$DIGEST\` |"
            echo "| Tags | $(jq -r '.tags | map("`" + . + "`") | join(", ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") |"
          } >> "$GITHUB_STEP_SUMMARY"
