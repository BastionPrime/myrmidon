name: Myrmidon bot image

# G1: builds docker/bot-runtime (a hermes gateway process for a bot/project
# container — item C1/H3 in docs/myrmidon/ROADMAP.md, "variant B") and
# publishes it to ghcr.io/itkadr-git/myrmidon-hermes. On a pull request this
# only checks that the image builds (no registry credentials involved, so
# this is safe to run for any PR against this repository, fork or not);
# push/push-by-digest only happens on push to main or a myr-v* release tag,
# by the pattern in myrmidon-image.yml.

on:
  push:
    branches: [main]
    tags: ["myr-v*"]
    paths:
      - "docker/bot-runtime/**"
      - ".github/workflows/myrmidon-bot-image.yml"
  pull_request:
    paths:
      - "docker/bot-runtime/**"
      - ".github/workflows/myrmidon-bot-image.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: myrmidon-bot-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/itkadr-git/myrmidon-hermes

jobs:
  build:
    name: build
    if: ${{ github.repository == 'itkadr-git/myrmidon' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/myr-v* ]]; then
            tag="${GITHUB_REF#refs/tags/myr-}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release tag must look like myr-vX.Y.Z, got ${GITHUB_REF#refs/tags/}"
              exit 1
            fi
            echo "image_tag=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.image_tag }},enable=${{ startsWith(github.ref, 'refs/tags/myr-v') }}
          labels: |
            org.opencontainers.image.title=Myrmidon bot runtime
            org.opencontainers.image.description=hermes gateway (API server) for a Myrmidon bot or project container
            org.opencontainers.image.source=https://github.com/itkadr-git/myrmidon
            org.opencontainers.image.licenses=MIT

      # PR: docker build only, no push — just a "does it build" check.
      - name: Build (pull request, no push)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker/bot-runtime
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          push: false
          load: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      # push to main / myr-v* tag: build, push by digest, tag after.
      - name: Build and push by digest
        id: build
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker/bot-runtime
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Tag the built digest
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"

      - name: Summary
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Myrmidon bot image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Digest | \`$IMAGE@$DIGEST\` |"
            echo "| Tags | $(jq -r '.tags | map("`" + . + "`") | join(", ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") |"
          } >> "$GITHUB_STEP_SUMMARY"
