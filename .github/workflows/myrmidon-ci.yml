name: Myrmidon CI

# Myrmidon's own CI (the vendor's pr.yml calls unpinned upstream code and is
# disabled). Two tiers, chosen by the `plan` job:
#   docs - only Myrmidon docs/scripts changed: script checks only;
#   fast - pull requests: typecheck (no Rust), build (no Rust release binary)
#          and only the tests that the change touches directly;
#   full - push to main, manual runs, PRs labelled `full-ci` (from the next
#          push on), and PRs touching
#          shared foundations (lockfile, db, shared, runner, CI...): every lane.
# A red full run on main opens (or updates) an issue labelled `main-red`.
# Everything runs on GitHub-hosted runners without secrets. See docs/myrmidon/ci.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded runs are cancelled on PRs and on main alike; a cancelled run
  # reports no `CI result`, so it can never look green.
  group: myrmidon-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Plan tier and tests
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          args=(plan --out "$RUNNER_TEMP/plan.json")
          if [ "$EVENT" = "pull_request" ]; then
            args+=(--base "$BASE" --head "$HEAD")
            if [ "$FULL_LABEL" = "true" ]; then args+=(--force-full); fi
          fi
          node scripts/myrmidon/ci/affected-tests.mjs "${args[@]}"

      - name: Upload plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-plan
          path: ${{ runner.temp }}/plan.json
          retention-days: 3

  typecheck:
    name: typecheck
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'fast' || needs.plan.outputs.tier == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Select pinned Rust toolchain
        if: ${{ needs.plan.outputs.tier == 'full' }}
        working-directory: packages/paperclip-runner
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust dependencies
        if: ${{ needs.plan.outputs.tier == 'full' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: myr-check
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        if: ${{ needs.plan.outputs.tier == 'full' }}
        run: pnpm typecheck

      - name: Typecheck all workspaces (runner Rust skipped)
        if: ${{ needs.plan.outputs.tier == 'fast' }}
        run: |
          set -euo pipefail
          pnpm run preflight:workspace-links
          pnpm -r --filter '!@paperclipai/paperclip-runner' typecheck
          pnpm --filter @paperclipai/paperclip-runner typecheck:typescript

  build:
    name: build
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'fast' || needs.plan.outputs.tier == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Select pinned Rust toolchain
        if: ${{ needs.plan.outputs.tier == 'full' }}
        working-directory: packages/paperclip-runner
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust dependencies
        if: ${{ needs.plan.outputs.tier == 'full' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: myr-build
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Runner issue-thread viewer
        run: pnpm --filter @paperclipai/paperclip-runner build:issue-thread

      - name: Build
        if: ${{ needs.plan.outputs.tier == 'full' }}
        run: pnpm build

      - name: Build (runner TypeScript only, no Rust release binary)
        if: ${{ needs.plan.outputs.tier == 'fast' }}
        run: |
          set -euo pipefail
          pnpm run preflight:workspace-links
          pnpm --filter @paperclipai/paperclip-runner build:typescript
          pnpm -r --filter '!@paperclipai/paperclip-runner' build

  tests-affected:
    name: tests (affected)
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-plan
          path: ${{ runner.temp }}

      - name: Build plugin SDK dependencies
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Run affected tests
        run: node scripts/myrmidon/ci/affected-tests.mjs run --plan "$RUNNER_TEMP/plan.json"

  tests:
    name: tests (${{ matrix.label }})
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Same split as the vendor's trusted PR CI: `pnpm test:run` equals the
        # union of the general groups and the serialized server suites.
        include:
          - { label: "server 1/5", mode: general, group: general-server, shard_index: 0, shard_count: 5 }
          - { label: "server 2/5", mode: general, group: general-server, shard_index: 1, shard_count: 5 }
          - { label: "server 3/5", mode: general, group: general-server, shard_index: 2, shard_count: 5 }
          - { label: "server 4/5", mode: general, group: general-server, shard_index: 3, shard_count: 5 }
          - { label: "server 5/5", mode: general, group: general-server, shard_index: 4, shard_count: 5 }
          - { label: "workspaces-a 1/2", mode: general, group: general-workspaces-a, shard_index: 0, shard_count: 2 }
          - { label: "workspaces-a 2/2", mode: general, group: general-workspaces-a, shard_index: 1, shard_count: 2 }
          - { label: "workspaces-b", mode: general, group: general-workspaces-b }
          - { label: "serialized 1/5", mode: serialized, shard_index: 0, shard_count: 5 }
          - { label: "serialized 2/5", mode: serialized, shard_index: 1, shard_count: 5 }
          - { label: "serialized 3/5", mode: serialized, shard_index: 2, shard_count: 5 }
          - { label: "serialized 4/5", mode: serialized, shard_index: 3, shard_count: 5 }
          - { label: "serialized 5/5", mode: serialized, shard_index: 4, shard_count: 5 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest (${{ matrix.label }})
        env:
          MODE: ${{ matrix.mode }}
          GROUP: ${{ matrix.group }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          set -euo pipefail
          args=()
          if [ "$MODE" = "general" ]; then
            args+=(--group "$GROUP")
          fi
          if [ -n "$SHARD_COUNT" ]; then
            args+=(--shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT")
          fi
          pnpm "test:run:$MODE" -- "${args[@]}"

  tests-other:
    # Packages whose tests `pnpm test:run` does not run (hermes adapter, MCP
    # servers, several adapters...): scripts/myrmidon/ci/extra-test-lanes.json.
    name: tests (other packages)
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin SDK dependencies
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Run tests of the other packages
        run: node scripts/myrmidon/ci/affected-tests.mjs extra

  tests-runner:
    # The vendor verifies the runner in its own lane (check:all: TypeScript,
    # protocol, Rust and API authority checks).
    name: tests (runner)
    needs: plan
    if: ${{ needs.plan.outputs.tier == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Select pinned Rust toolchain
        if: ${{ needs.plan.outputs.tier == 'full' }}
        working-directory: packages/paperclip-runner
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust dependencies
        if: ${{ needs.plan.outputs.tier == 'full' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: myr-runner
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the runner
        run: pnpm --filter @paperclipai/paperclip-runner check:all

  checks:
    # Cheap checks that run on every tier: node:test suites of our scripts,
    # gitleaks, the internal-address scan, dependency licenses and plugin
    # compatibility. Every step runs even if an earlier one failed.
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Select commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          skip_tests=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
            # Vendor release sync brings vendor test fixtures with sample addresses.
            case "$HEAD_REF" in sync/*) skip_tests="--skip-tests" ;; esac
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"
          else
            base="$GITHUB_SHA~1"; head="$GITHUB_SHA"
          fi
          {
            echo "base=$base"
            echo "head=$head"
            echo "skip_tests=$skip_tests"
          } >> "$GITHUB_OUTPUT"
          echo "range: $base..$head"

      - name: Shellcheck deploy scripts
        run: shellcheck --version && shellcheck -x scripts/myrmidon/deploy/*.sh

      - name: Script tests (node:test under scripts/myrmidon)
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts/myrmidon -name '*.test.mjs' -type f | sort)
          printf 'Running %s\n' "${files[@]}"
          node --test "${files[@]}"

      - name: Secrets (gitleaks, new commits)
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --config .gitleaks.toml --log-opts="$BASE..$HEAD" .

      - name: Internal addresses (private networks)
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          SKIP_TESTS: ${{ steps.range.outputs.skip_tests }}
        run: |
          args=(--check private-ip --base "$BASE" --head "$HEAD")
          if [ -n "$SKIP_TESTS" ]; then args+=("$SKIP_TESTS"); fi
          node scripts/myrmidon/scan-diff.mjs "${args[@]}"

      - name: Internal addresses (forbidden patterns from the repository secret)
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          MYRMIDON_FORBIDDEN_PATTERNS: ${{ secrets.MYRMIDON_FORBIDDEN_PATTERNS }}
        run: node scripts/myrmidon/scan-diff.mjs --check forbidden --base "$BASE" --head "$HEAD"

      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile

      - name: Licenses of production dependencies
        if: ${{ !cancelled() }}
        run: node scripts/myrmidon/check-licenses.mjs

      - name: Plugin compatibility — build plugin SDK and shared from the repository
        id: sdk
        if: ${{ !cancelled() }}
        run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Plugin compatibility — manifest snapshots (offline)
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: pnpm --filter @paperclipai/server exec tsx ../scripts/myrmidon/plugin-compat/check.ts --fixtures-only

      - name: Plugin compatibility — installed plugins against the host
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          set -euo pipefail
          node scripts/myrmidon/plugin-compat/install.mjs --work "$RUNNER_TEMP/plugin-compat"
          pnpm --filter @paperclipai/server exec tsx ../scripts/myrmidon/plugin-compat/check.ts --work "$RUNNER_TEMP/plugin-compat"

  fleetd:
    # tools/fleetd (the fleet service for a second machine's bot containers,
    # FLEETD-VMEXEC): gofmt, go vet and the unit tests, in the same pinned Go
    # image the fleetd image workflow builds from. The image itself is built
    # by myrmidon-fleetd.yml. See docs/myrmidon/fleetd-vmexec.md.
    name: fleetd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GO_IMAGE: golang:1.25-bookworm@sha256:3b4a11519ad929d1e1d261a12cff056f0c85b735253d7d861346b9c6f8b36437
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: go.mod has no requirements (stdlib only)
        run: |
          set -euo pipefail
          if grep -qE '^\s*(require|tool)\s' tools/fleetd/go.mod; then
            echo "tools/fleetd/go.mod must stay stdlib-only"
            exit 1
          fi

      - name: gofmt, go vet, go test
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD/tools/fleetd:/src" -w /src \
            -e GOFLAGS=-mod=mod -e GOTOOLCHAIN=local -e GOCACHE=/tmp/gocache "$GO_IMAGE" sh -euc '
              out="$(gofmt -l .)"
              if [ -n "$out" ]; then echo "gofmt: $out"; exit 1; fi
              go vet ./...
              go test -count=1 ./...
            '

  dockergate:
    # tools/dockergate (the allowlisting Docker proxy for the bot-container
    # driver): gofmt, go vet, the unit tests, and the contract with the driver
    # (spec: the fixtures are emitted afresh from the TypeScript of this commit
    # and the Go tests run against them). Every tier: it takes about two
    # minutes and a red dockergate must not merge. The image itself is built by
    # myrmidon-dockergate.yml. See docs/myrmidon/dockergate.md.
    name: dockergate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GO_IMAGE: golang:1.25-bookworm@sha256:3b4a11519ad929d1e1d261a12cff056f0c85b735253d7d861346b9c6f8b36437
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: go.mod has no requirements (stdlib only)
        run: |
          set -euo pipefail
          if grep -Eq '^\s*require\b' tools/dockergate/go.mod || [ -e tools/dockergate/go.sum ]; then
            echo "::error::tools/dockergate must depend on the standard library only"
            exit 1
          fi

      - name: gofmt, go vet, go test (checked-in fixtures)
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD/tools/dockergate:/src" -w /src \
            -e GOFLAGS=-mod=mod -e GOTOOLCHAIN=local -e GOCACHE=/tmp/gocache "$GO_IMAGE" sh -euc '
              out="$(gofmt -l .)"
              if [ -n "$out" ]; then echo "gofmt: $out"; exit 1; fi
              go vet ./...
              go test -count=1 ./...
            '

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Locate pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read only)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: myr-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: myr-pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract with the driver (fixtures emitted from this commit)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dockergate-contract"
          rm -rf "$out" && mkdir -p "$out"
          pnpm --filter @paperclipai/server exec tsx ../tools/dockergate/contract/emit-fixtures.ts "$out"
          # The static fixtures must equal the checked-in ones; traffic.json
          # carries wall-clock mtimes and is only replayed, not compared.
          diff -r -x traffic.json tools/dockergate/contract/testdata "$out"
          docker run --rm --network none -v "$PWD/tools/dockergate:/src" -v "$out:/contract:ro" -w /src \
            -e GOFLAGS=-mod=mod -e GOTOOLCHAIN=local -e GOCACHE=/tmp/gocache \
            -e DOCKERGATE_CONTRACT_DIR=/contract "$GO_IMAGE" go test -count=1 ./...

  ci-result:
    # Single stable name for the ruleset. Lanes the plan did not need are
    # skipped; any failure, or a skip without a successful plan, fails it.
    name: CI result
    if: ${{ !cancelled() }}
    needs: [plan, typecheck, build, tests-affected, tests, tests-other, tests-runner, checks, dockergate, fleetd]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
          TIER: ${{ needs.plan.outputs.tier }}
        run: |
          echo "tier: $TIER"
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            .plan.result == "success" and
            all(to_entries[]; .value.result == "success" or .value.result == "skipped")
          ' > /dev/null

  report-main:
    # Keeps an issue labelled `main-red` open while main is red: one issue,
    # a comment per red run, closed by the next green run.
    name: report main status
    needs: [ci-result]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Open, update or close the main-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ needs.ci-result.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$REPO" --label main-red --state open --json number --jq '.[0].number // empty')"
          if [ "$RESULT" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$REPO" --comment "main is green again at $GITHUB_SHA ($RUN_URL)."
            fi
            exit 0
          fi
          jobs="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name' || true)"
          # Log lines are "job<TAB>step<TAB>timestamp text"; keep test failure lines.
          tests="$(gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null \
            | sed -E 's/^[^\t]*\t[^\t]*\t[^ ]+ //; s/\x1b\[[0-9;]*m//g' \
            | grep -E '^ ?(FAIL |✖ )|^  [^ ].* — ' | sort -u | head -30 || true)"
          body="$(printf 'Full CI failed on main at %s.\n\nRun: %s\n\nFailed jobs:\n%s\n\nFailing tests (from the logs):\n```\n%s\n```\n' \
            "$GITHUB_SHA" "$RUN_URL" "${jobs:-unknown}" "${tests:-see the run logs}")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh label create main-red --repo "$REPO" --color B60205 --description "Full CI is red on main" --force >/dev/null
            gh issue create --repo "$REPO" --title "main is red at ${GITHUB_SHA:0:9}" --label main-red --body "$body"
          fi
