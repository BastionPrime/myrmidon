# Shared media/office tools for container bots.
# `bots` (Docker network the bot containers live on) must already exist: it is the
# same network as the bots use (MYRMIDON_BOT_NETWORK). `media-backend` is internal:
# no route out and no route from the bots; only the facade and the worker sit on it.
#
# Before `up`: create ./config/bots.json (see README), the secret file
# ./secrets/worker_token (random, >= 32 chars), and make ./spool writable by uid 10001.

name: media-tools

networks:
  bots:
    external: true
    name: myrmidon-bots
  media-backend:
    internal: true

volumes:
  spool: {}

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  pids_limit: 512

# Ready-made third-party images: writable rootfs (LibreOffice/Chromium/JVM write profiles and caches),
# everything else dropped. The rootfs is not shared with anything and the network is internal.
x-third-party: &third-party
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  pids_limit: 1024

services:
  media-mcp:  # the only service the bots can reach: http://media-mcp:8080/mcp
    <<: *hardening
    image: ghcr.io/itkadr-git/myrmidon-media-mcp:${MEDIA_TAG:-main}
    user: "10001:10001"
    networks: [bots, media-backend]
    environment:
      MEDIA_BOTS_FILE: /config/bots.json
      MEDIA_WORKER_TOKEN_FILE: /run/secrets/worker_token
      MEDIA_GOTENBERG_URL: http://gotenberg:3000
      MEDIA_TIKA_URL: http://tika:9998
      MEDIA_WORKER_URL: http://media-worker:8081
    secrets: [worker_token]
    volumes:
      - ./config:/config:ro
      - spool:/spool
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 512m
    cpus: 1.0

  media-worker:  # ffmpeg / ffprobe / pdftoppm
    <<: *hardening
    image: ghcr.io/itkadr-git/myrmidon-media-worker:${MEDIA_TAG:-main}
    user: "10001:10001"
    networks: [media-backend]
    environment:
      MEDIA_WORKER_TOKEN_FILE: /run/secrets/worker_token
      WORKER_CONCURRENCY: "2"
    secrets: [worker_token]
    volumes:
      - spool:/spool
    tmpfs: ["/tmp:size=512m"]
    mem_limit: 3g
    cpus: 2.0

  gotenberg:  # LibreOffice + Chromium, ready-made image pinned by digest (8.37.0)
    <<: *third-party
    image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    networks: [media-backend]
    command:
      - gotenberg
      - --api-timeout=120s
      - --libreoffice-restart-after=25
      - --chromium-restart-after=25
    tmpfs: ["/tmp:size=1g", "/home/gotenberg:size=256m,uid=1001,gid=1001"]
    mem_limit: 2g
    cpus: 2.0

  tika:  # Tika Server full + Tesseract rus+eng
    <<: *third-party
    image: ghcr.io/itkadr-git/myrmidon-media-tika:${MEDIA_TAG:-main}
    networks: [media-backend]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx768m"
    tmpfs: ["/tmp:size=512m"]
    mem_limit: 1536m
    cpus: 2.0

secrets:
  worker_token:
    file: ./secrets/worker_token
