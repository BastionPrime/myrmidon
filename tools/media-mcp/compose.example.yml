# Shared media/office tools for container bots.
# `bots` (Docker network the bot containers live on) must already exist: it is the
# same network as the bots use (MYRMIDON_BOT_NETWORK). `media-backend` is internal:
# no route out and no route from the bots; only the facade and the worker sit on it.
#
# Before `up`: create ./config/bots.json (see README) and the secret file
# ./secrets/worker_token (random, >= 32 chars). The `spool` volume is a named volume: the images
# create /spool owned by uid 10001, so Docker initialises the volume with that owner on first use.
# A named volume has no size limit of its own; see the `spool` volume below.

name: media-tools

networks:
  bots:
    external: true
    name: myrmidon-bots
  media-backend:
    internal: true

volumes:
  # Everything the bots store and every job writes lives here (48 h TTL). Two limits protect the host:
  # the service refuses new data past MEDIA_SPOOL_MAX_BYTES and when less than MEDIA_SPOOL_MIN_FREE_BYTES
  # is free on this filesystem. The second one only helps if the volume is not the host's root disk, so
  # put the spool on its own size-limited filesystem (a dedicated partition or LV, or a loop-mounted
  # image, mounted e.g. at /srv/media-spool and chowned to 10001:10001) and use the driver_opts form.
  spool: {}
  # spool:
  #   driver: local
  #   driver_opts: {type: none, o: bind, device: /srv/media-spool}

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  pids_limit: 512

# Ready-made third-party images: writable rootfs (LibreOffice/Chromium/JVM write profiles and caches),
# everything else dropped. The rootfs is not shared with anything and the network is internal.
x-third-party: &third-party
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  pids_limit: 1024

services:
  media-mcp:  # the only service the bots can reach: http://media-mcp:8080/mcp
    <<: *hardening
    image: ghcr.io/itkadr-git/myrmidon-media-mcp:${MEDIA_TAG:-main}
    user: "10001:10001"
    networks: [bots, media-backend]
    environment:
      MEDIA_BOTS_FILE: /config/bots.json
      MEDIA_WORKER_TOKEN_FILE: /run/secrets/worker_token
      MEDIA_GOTENBERG_URL: http://gotenberg:3000
      MEDIA_TIKA_URL: http://tika:9998
      MEDIA_WORKER_URL: http://media-worker:8081
      MEDIA_ALLOWED_HOSTS: media-mcp,media-mcp:8080  # Host header values the MCP endpoint accepts
      MEDIA_SPOOL_MAX_BYTES: "68719476736"  # 64 GiB for all bots together; keep below the spool filesystem size
      MEDIA_SPOOL_MIN_FREE_BYTES: "2147483648"  # refuse writes when the spool filesystem has less free
    secrets: [worker_token]
    volumes:
      - ./config:/config:ro
      - spool:/spool
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 512m
    cpus: 1.0

  media-worker:  # ffmpeg / ffprobe / pdftoppm
    <<: *hardening
    image: ghcr.io/itkadr-git/myrmidon-media-worker:${MEDIA_TAG:-main}
    user: "10001:10001"
    networks: [media-backend]
    environment:
      MEDIA_WORKER_TOKEN_FILE: /run/secrets/worker_token
      WORKER_CONCURRENCY: "2"
      MEDIA_SPOOL_MIN_FREE_BYTES: "2147483648"
    secrets: [worker_token]
    volumes:
      - spool:/spool
    tmpfs: ["/tmp:size=512m"]
    mem_limit: 3g
    cpus: 2.0

  gotenberg:  # LibreOffice + Chromium, ready-made image pinned by digest (8.37.0)
    <<: *third-party
    image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    networks: [media-backend]
    command:
      - gotenberg
      - --api-timeout=120s
      # HTML comes from bots: no scripts, and only the request's own files (in /tmp) and data: URIs load.
      # Everything else, including http(s) to other services on this network, is refused.
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^(file:///tmp/|data:)
      - --libreoffice-restart-after=25
      - --chromium-restart-after=25
    tmpfs: ["/tmp:size=1g", "/home/gotenberg:size=256m,uid=1001,gid=1001"]
    mem_limit: 2g
    cpus: 2.0

  tika:  # Tika Server full + Tesseract rus+eng
    <<: *third-party
    image: ghcr.io/itkadr-git/myrmidon-media-tika:${MEDIA_TAG:-main}
    networks: [media-backend]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx768m"
    tmpfs: ["/tmp:size=512m"]
    mem_limit: 1536m
    cpus: 2.0

secrets:
  worker_token:
    file: ./secrets/worker_token
