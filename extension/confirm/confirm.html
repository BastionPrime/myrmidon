<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Myrmidon Bridge — confirm</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 360px; margin: 0; padding: 16px; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      p { font-size: 13px; margin: 6px 0; }
      code { background: #f6f8fa; padding: 1px 4px; word-break: break-all; }
      button { margin: 12px 8px 0 0; padding: 6px 14px; }
      .muted { color: #57606a; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Confirm this action?</h1>
    <p><code id="summary"></code></p>
    <p class="muted">
      Nothing runs until you choose. Refusing is the same as letting the
      confirmation time out.
    </p>
    <button id="confirm" type="button">Confirm</button>
    <button id="refuse" type="button">Refuse</button>
    <script type="module" src="../entry-confirm.js"></script>
  </body>
</html>
